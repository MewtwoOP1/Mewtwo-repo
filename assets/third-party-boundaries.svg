<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">Repository scope and third-party services</title>
  <desc id="desc">Mewtwo Repo provides integration code and configuration only. External services and sources operate independently and control their own content and availability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1324"/><stop offset="1" stop-color="#122B31"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#0D9488"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94A3B8"/></marker>
  </defs>
  <rect width="1200" height="250" rx="24" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="42" y="42" fill="#A5B4FC" font-size="13" font-weight="700" letter-spacing="2.5">CLEAR PROJECT BOUNDARIES</text>
    <rect x="42" y="65" width="400" height="132" rx="17" fill="#1D2040" stroke="#8B5CF6" stroke-opacity=".8"/>
    <rect x="65" y="87" width="46" height="46" rx="12" fill="url(#violet)"/>
    <path d="M77 100h22v20H77zM82 95h12M82 125h12" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="102" font-size="20" font-weight="700" fill="#F8FAFC">Mewtwo Repo</text>
    <text x="65" y="154" font-size="15" fill="#E0E7FF">Publishes integration code and setup</text>
    <text x="65" y="176" font-size="15" fill="#E0E7FF">information — not hosted media.</text>
    <path d="M461 130H526" stroke="#94A3B8" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="494" y="115" text-anchor="middle" fill="#9CA3AF" font-size="12">connects to</text>
    <rect x="548" y="65" width="610" height="132" rx="17" fill="#11302F" stroke="#14B8A6" stroke-opacity=".8"/>
    <rect x="572" y="87" width="46" height="46" rx="12" fill="url(#teal)"/>
    <circle cx="595" cy="104" r="8" fill="none" stroke="#FFF" stroke-width="2"/><path d="M579 126c2-9 10-13 16-13s14 4 16 13M595 96v-5" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
    <text x="636" y="102" font-size="20" font-weight="700" fill="#F0FDFA">Independent third parties</text>
    <text x="572" y="154" font-size="15" fill="#CCFBF1">Operate their own sources, services, content,</text>
    <text x="572" y="176" font-size="15" fill="#CCFBF1">availability, access rules, and terms.</text>
    <text x="42" y="226" fill="#A7B4CC" font-size="13">External services can change, fail, or become unavailable independently of this repository.</text>
  </g>
</svg>