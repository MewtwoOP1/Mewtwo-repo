<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Mewtwo Repo — community sources for Zangetsu</title>
  <desc id="desc">A dark indigo banner with violet and teal gradients, abstract orbital curves, and the Mewtwo Repo title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.56" stop-color="#171A3B"/>
      <stop offset="1" stop-color="#102B36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".34"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#C4B5FD" opacity=".22"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="28" fill="url(#dots)"/>
  <circle cx="890" cy="130" r="280" fill="url(#glow)"/>
  <circle cx="1000" cy="170" r="150" fill="none" stroke="#A78BFA" stroke-width="1.4" opacity=".35"/>
  <circle cx="1000" cy="170" r="110" fill="none" stroke="#5EEAD4" stroke-width="1.4" opacity=".3"/>
  <circle cx="1000" cy="170" r="70" fill="none" stroke="#C4B5FD" stroke-width="1.4" opacity=".35"/>
  <path d="M760 22 C900 90 930 230 1178 285" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity=".7"/>
  <path d="M825 8 C925 90 1050 230 1192 225" fill="none" stroke="#5EEAD4" stroke-width="1.5" opacity=".4"/>
  <g transform="translate(855 83)">
    <circle cx="145" cy="87" r="44" fill="#15172F" stroke="url(#accent)" stroke-width="2.5"/>
    <path d="M122 105 L122 70 L145 92 L168 70 L168 105" fill="none" stroke="#E9D5FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="145" cy="87" r="56" fill="none" stroke="#A78BFA" stroke-width="1" stroke-dasharray="3 8" opacity=".6"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="76" y="89" fill="#C4B5FD" font-size="17" font-weight="700" letter-spacing="4">ZANGETSU • COMMUNITY SOURCES</text>
    <text x="72" y="169" fill="#FFFFFF" font-size="62" font-weight="800" letter-spacing="-2">Mewtwo Repo</text>
    <rect x="76" y="196" width="110" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="76" y="239" fill="#DCE3F5" font-size="24" font-weight="500">One catalogue. Your choice of playback.</text>
    <text x="76" y="282" fill="#AAB6D3" font-size="16" letter-spacing="1.3">PENCARIMOVIE  /  AIOSTREAMS  /  STREMIO</text>
  </g>
</svg>