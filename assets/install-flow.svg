<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="instTitle instDesc">
  <title id="instTitle">Installing a Mewtwo Repo source</title>
  <desc id="instDesc">A four-step flow. Step one: add the repository by pasting the manifest URL in Settings, Providers, Zangetsu providers, Repositories, Add repo. Step two: pick a source from the repository list and install it. Step three: open the source settings and fill in any required values. Step four: search for a title, open it and start playback.</desc>
  <defs>
    <linearGradient id="instBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E22"/>
      <stop offset="1" stop-color="#16103C"/>
    </linearGradient>
    <linearGradient id="instStep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="instAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F472B6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <marker id="instArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F9A8D4"/>
    </marker>
  </defs>

  <rect width="1200" height="330" rx="20" fill="url(#instBg)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="328.5" rx="19.25" fill="none" stroke="#A78BFA" stroke-opacity=".3"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="36" y="42" fill="#A5B4FC" font-size="14" font-weight="700" letter-spacing="3">INSTALLATION FLOW</text>
    <text x="36" y="70" fill="#F8FAFC" font-size="23" font-weight="700">Four steps, about a minute</text>

    <!-- step cards -->
    <g transform="translate(36 96)">
      <rect width="258" height="180" rx="16" fill="url(#instStep)" stroke="#818CF8" stroke-opacity=".8"/>
      <circle cx="34" cy="34" r="17" fill="url(#instAccent)"/>
      <text x="34" y="40" text-anchor="middle" fill="#150B2E" font-size="17" font-weight="800">1</text>
      <text x="62" y="40" fill="#FFFFFF" font-size="17" font-weight="700">Add the repo</text>
      <text x="22" y="76" fill="#C7D2FE" font-size="13">Settings → Providers →</text>
      <text x="22" y="96" fill="#C7D2FE" font-size="13">Zangetsu providers →</text>
      <text x="22" y="116" fill="#C7D2FE" font-size="13">Repositories → Add repo</text>
      <text x="22" y="144" fill="#FBCFE8" font-size="12.5">Paste the index.json URL</text>
      <text x="22" y="164" fill="#FBCFE8" font-size="12.5">and give it a name.</text>
    </g>

    <g transform="translate(326 96)">
      <rect width="258" height="180" rx="16" fill="url(#instStep)" stroke="#818CF8" stroke-opacity=".8"/>
      <circle cx="34" cy="34" r="17" fill="url(#instAccent)"/>
      <text x="34" y="40" text-anchor="middle" fill="#150B2E" font-size="17" font-weight="800">2</text>
      <text x="62" y="40" fill="#FFFFFF" font-size="17" font-weight="700">Install sources</text>
      <text x="22" y="76" fill="#C7D2FE" font-size="13">The repository tab lists</text>
      <text x="22" y="96" fill="#C7D2FE" font-size="13">every source it publishes.</text>
      <text x="22" y="116" fill="#C7D2FE" font-size="13">Install only the ones you</text>
      <text x="22" y="136" fill="#C7D2FE" font-size="13">want to use.</text>
    </g>

    <g transform="translate(616 96)">
      <rect width="258" height="180" rx="16" fill="url(#instStep)" stroke="#818CF8" stroke-opacity=".8"/>
      <circle cx="34" cy="34" r="17" fill="url(#instAccent)"/>
      <text x="34" y="40" text-anchor="middle" fill="#150B2E" font-size="17" font-weight="800">3</text>
      <text x="62" y="40" fill="#FFFFFF" font-size="17" font-weight="700">Configure</text>
      <text x="22" y="76" fill="#C7D2FE" font-size="13">Most sources work with</text>
      <text x="22" y="96" fill="#C7D2FE" font-size="13">zero setup. A few need a</text>
      <text x="22" y="116" fill="#C7D2FE" font-size="13">manifest URL, an API key</text>
      <text x="22" y="136" fill="#C7D2FE" font-size="13">or your own server.</text>
    </g>

    <g transform="translate(906 96)">
      <rect width="258" height="180" rx="16" fill="url(#instStep)" stroke="#818CF8" stroke-opacity=".8"/>
      <circle cx="34" cy="34" r="17" fill="url(#instAccent)"/>
      <text x="34" y="40" text-anchor="middle" fill="#150B2E" font-size="17" font-weight="800">4</text>
      <text x="62" y="40" fill="#FFFFFF" font-size="17" font-weight="700">Watch</text>
      <text x="22" y="76" fill="#C7D2FE" font-size="13">Search a title, open the</text>
      <text x="22" y="96" fill="#C7D2FE" font-size="13">details page, pick an</text>
      <text x="22" y="116" fill="#C7D2FE" font-size="13">episode and start the</text>
      <text x="22" y="136" fill="#C7D2FE" font-size="13">stream.</text>
    </g>

    <!-- arrows -->
    <g stroke="#F9A8D4" stroke-width="2.4" marker-end="url(#instArrow)">
      <path d="M300 186 H318"/>
      <path d="M590 186 H608"/>
      <path d="M880 186 H898"/>
    </g>

    <!-- footer note -->
    <rect x="36" y="292" width="1128" height="1" fill="#A78BFA" fill-opacity=".25"/>
    <text x="36" y="314" fill="#A5B4FC" font-size="12.5">Updates: Settings → Providers → Zangetsu providers → Repositories → Check for updates, then Update all.</text>
  </g>
</svg>
