<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">Catalogue and playback are separate paths</title>
  <desc id="flowDesc">A diagram showing that within a single Mewtwo Repo source, the catalogue half resolves titles, artwork and episode lists, while the playback half resolves playable stream URLs. The two halves are independent: a title can appear in the catalogue even when no stream is available.</desc>
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E22"/>
      <stop offset="1" stop-color="#141033"/>
    </linearGradient>
    <linearGradient id="flowCat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="flowPlay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#831843"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="flowSrc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C4B5FD"/>
    </marker>
    <marker id="flowArrowPink" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#F9A8D4"/>
    </marker>
  </defs>

  <rect width="1200" height="380" rx="20" fill="url(#flowBg)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="19.25" fill="none" stroke="#A78BFA" stroke-opacity=".3"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="36" y="42" fill="#A5B4FC" font-size="14" font-weight="700" letter-spacing="3">TWO INDEPENDENT HALVES</text>
    <text x="36" y="70" fill="#F8FAFC" font-size="23" font-weight="700">Catalogue metadata ≠ playback</text>

    <!-- source box -->
    <rect x="36" y="104" width="232" height="212" rx="16" fill="url(#flowSrc)" stroke="#5EEAD4" stroke-opacity=".8"/>
    <text x="60" y="140" fill="#CCFBF1" font-size="13" font-weight="700" letter-spacing="1.6">ONE SOURCE</text>
    <text x="60" y="172" fill="#FFFFFF" font-size="21" font-weight="700">Mewtwo Repo</text>
    <text x="60" y="196" fill="#99F6E4" font-size="13">e.g. TMDB + Stremio,</text>
    <text x="60" y="214" fill="#99F6E4" font-size="13">AIOStreams, CineStream,</text>
    <text x="60" y="232" fill="#99F6E4" font-size="13">AniChan, Miruro, Jellyfin</text>
    <rect x="60" y="252" width="184" height="1" fill="#5EEAD4" fill-opacity=".35"/>
    <text x="60" y="276" fill="#99F6E4" font-size="12.5">26 sources in the manifest,</text>
    <text x="60" y="294" fill="#99F6E4" font-size="12.5">each installed separately.</text>

    <!-- catalogue half -->
    <path d="M268 162 H330" fill="none" stroke="#C4B5FD" stroke-width="2.4" marker-end="url(#flowArrow)"/>
    <rect x="340" y="104" width="366" height="96" rx="16" fill="url(#flowCat)" stroke="#818CF8" stroke-opacity=".85"/>
    <text x="364" y="134" fill="#C7D2FE" font-size="12.5" font-weight="700" letter-spacing="1.4">CATALOGUE HALF</text>
    <text x="364" y="160" fill="#FFFFFF" font-size="17" font-weight="700">Search · details · episodes</text>
    <text x="364" y="184" fill="#C7D2FE" font-size="13">Titles, artwork, scores, episode lists</text>

    <!-- playback half -->
    <path d="M268 260 H330" fill="none" stroke="#F9A8D4" stroke-width="2.4" marker-end="url(#flowArrowPink)"/>
    <rect x="340" y="212" width="366" height="104" rx="16" fill="url(#flowPlay)" stroke="#F472B6" stroke-opacity=".85"/>
    <text x="364" y="242" fill="#FBCFE8" font-size="12.5" font-weight="700" letter-spacing="1.4">PLAYBACK HALF</text>
    <text x="364" y="268" fill="#FFFFFF" font-size="18" font-weight="700">getVideoSources() per episode</text>
    <text x="364" y="292" fill="#FBCFE8" font-size="13">Stream URLs, quality labels, request headers</text>

    <!-- downstream -->
    <path d="M706 152 H764" fill="none" stroke="#C4B5FD" stroke-width="2.4" marker-end="url(#flowArrow)"/>
    <rect x="774" y="104" width="390" height="96" rx="16" fill="#141A33" stroke="#475569" stroke-opacity=".9"/>
    <text x="798" y="134" fill="#CBD5E1" font-size="12.5" font-weight="700" letter-spacing="1.4">METADATA BACKENDS</text>
    <text x="798" y="160" fill="#F1F5F9" font-size="15" font-weight="600">TMDB · AniList · the site's own API</text>
    <text x="798" y="184" fill="#94A3B8" font-size="13">Free, public, and normally rate-limited</text>

    <path d="M706 264 H764" fill="none" stroke="#F9A8D4" stroke-width="2.4" marker-end="url(#flowArrowPink)"/>
    <rect x="774" y="212" width="390" height="104" rx="16" fill="#241433" stroke="#9D174D" stroke-opacity=".85"/>
    <text x="798" y="242" fill="#FBCFE8" font-size="12.5" font-weight="700" letter-spacing="1.4">PLAYBACK BACKENDS</text>
    <text x="798" y="268" fill="#FCE7F3" font-size="15" font-weight="600">Add-ons · your server · streaming hosts</text>
    <text x="798" y="292" fill="#F9A8D4" font-size="13">Availability is decided entirely upstream</text>

    <!-- callout -->
    <rect x="36" y="332" width="1128" height="1" fill="#A78BFA" fill-opacity=".25"/>
    <text x="36" y="358" fill="#C4B5FD" font-size="13">A title can appear in the catalogue while no playable link exists — that is an upstream condition, not a bug in the app.</text>
  </g>
</svg>
