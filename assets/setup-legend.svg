<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="230" viewBox="0 0 1120 230" role="img" aria-labelledby="setupTitle setupDesc">
  <title id="setupTitle">Setup requirement legend</title>
  <desc id="setupDesc">Four labelled badges used throughout the documentation: Ready to use, works out of the box with no configuration; Ready with defaults, settings exist but every default works; Optional credentials, keys unlock extra providers but the source already works; Requires configuration, a value must be entered before the source can return streams.</desc>
  <defs>
    <linearGradient id="setupBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E22"/>
      <stop offset="1" stop-color="#150F33"/>
    </linearGradient>
    <linearGradient id="setupGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="setupViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="setupAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="setupRose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="230" rx="18" fill="url(#setupBg)"/>
  <rect x="0.75" y="0.75" width="1118.5" height="228.5" rx="17.25" fill="none" stroke="#A78BFA" stroke-opacity=".3"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="30" y="42" fill="#A5B4FC" font-size="13" font-weight="700" letter-spacing="2.6">SETUP LEGEND</text>

    <!-- badge 1 -->
    <g transform="translate(30 64)">
      <rect width="252" height="132" rx="14" fill="#0D1526" stroke="url(#setupGreen)" stroke-opacity=".75"/>
      <circle cx="34" cy="36" r="13" fill="url(#setupGreen)" fill-opacity=".22" stroke="#34D399" stroke-opacity=".8"/>
      <path d="M28 36 l4.5 4.5 L41 32" fill="none" stroke="#6EE7B7" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="42" fill="#D1FAE5" font-size="15.5" font-weight="700">Ready to use</text>
      <text x="22" y="74" fill="#94A3B8" font-size="12.5">No settings at all. Install the</text>
      <text x="22" y="92" fill="#94A3B8" font-size="12.5">source and search.</text>
      <text x="22" y="116" fill="#6EE7B7" font-size="12" font-weight="600">Zero configuration</text>
    </g>

    <!-- badge 2 -->
    <g transform="translate(302 64)">
      <rect width="252" height="132" rx="14" fill="#0D1526" stroke="url(#setupViolet)" stroke-opacity=".75"/>
      <circle cx="34" cy="36" r="13" fill="url(#setupViolet)" fill-opacity=".22" stroke="#A78BFA" stroke-opacity=".8"/>
      <path d="M28 36 l4.5 4.5 L41 32" fill="none" stroke="#C4B5FD" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="42" fill="#EDE9FE" font-size="15.5" font-weight="700">Ready with defaults</text>
      <text x="22" y="74" fill="#94A3B8" font-size="12.5">Settings exist and every default</text>
      <text x="22" y="92" fill="#94A3B8" font-size="12.5">already works. Tuning is optional.</text>
      <text x="22" y="116" fill="#C4B5FD" font-size="12" font-weight="600">Optional tuning</text>
    </g>

    <!-- badge 3 -->
    <g transform="translate(574 64)">
      <rect width="252" height="132" rx="14" fill="#0D1526" stroke="url(#setupAmber)" stroke-opacity=".75"/>
      <circle cx="34" cy="36" r="13" fill="url(#setupAmber)" fill-opacity=".22" stroke="#FBBF24" stroke-opacity=".8"/>
      <path d="M34 29 v8 M34 43 v1.5" fill="none" stroke="#FCD34D" stroke-width="2.8" stroke-linecap="round"/>
      <text x="58" y="42" fill="#FEF3C7" font-size="15.5" font-weight="700">Optional credentials</text>
      <text x="22" y="74" fill="#94A3B8" font-size="12.5">The source works now. A key</text>
      <text x="22" y="92" fill="#94A3B8" font-size="12.5">unlocks extra providers.</text>
      <text x="22" y="116" fill="#FCD34D" font-size="12" font-weight="600">Extra providers unlocked</text>
    </g>

    <!-- badge 4 -->
    <g transform="translate(846 64)">
      <rect width="244" height="132" rx="14" fill="#0D1526" stroke="url(#setupRose)" stroke-opacity=".75"/>
      <circle cx="34" cy="36" r="13" fill="url(#setupRose)" fill-opacity=".22" stroke="#FB7185" stroke-opacity=".8"/>
      <path d="M29 31 l10 10 M39 31 l-10 10" fill="none" stroke="#FDA4AF" stroke-width="2.6" stroke-linecap="round"/>
      <text x="58" y="42" fill="#FFE4E6" font-size="15.5" font-weight="700">Requires setup</text>
      <text x="22" y="74" fill="#94A3B8" font-size="12.5">A URL, key or account must be</text>
      <text x="22" y="92" fill="#94A3B8" font-size="12.5">entered before streams appear.</text>
      <text x="22" y="116" fill="#FDA4AF" font-size="12" font-weight="600">Action required</text>
    </g>

    <text x="30" y="214" fill="#7C83A8" font-size="12">Levels are derived from the manifest and provider code, not from marketing copy. See docs/SOURCE_CONFIGURATION.md.</text>
  </g>
</svg>
