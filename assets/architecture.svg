<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Mewtwo Repo provider architecture</title>
  <desc id="archDesc">A layered diagram. The top layer is the Zangetsu app, which downloads index.json from the repository, installs individual provider scripts, and calls their JavaScript functions. The middle layer shows the seven provider API calls in order: getInfo, getSettings, getHome and popular, search, getDetail and getEpisodes, and getVideoSources. The bottom layer lists the host-injected globals and the fetch helper that every provider uses, plus the external services each provider calls.</desc>

  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0E22"/>
      <stop offset="1" stop-color="#15103A"/>
    </linearGradient>
    <linearGradient id="archApp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="archRepo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#831843"/>
      <stop offset="1" stop-color="#9D174D"/>
    </linearGradient>
    <linearGradient id="archApi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="archHost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3F3F46"/>
      <stop offset="1" stop-color="#52525B"/>
    </linearGradient>
    <linearGradient id="archExt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A16207"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <marker id="archArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C4B5FD"/>
    </marker>
    <marker id="archArrowDim" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="20" fill="url(#archBg)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="558.5" rx="19.25" fill="none" stroke="#A78BFA" stroke-opacity=".3"/>

  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">

    <!-- title -->
    <text x="36" y="44" fill="#A5B4FC" font-size="14" font-weight="700" letter-spacing="3">PROVIDER ARCHITECTURE</text>
    <text x="36" y="72" fill="#F8FAFC" font-size="23" font-weight="700">How a source moves through Zangetsu</text>

    <!-- Layer 1 : app + repo -->
    <g>
      <rect x="36" y="96" width="540" height="118" rx="16" fill="url(#archApp)" stroke="#818CF8" stroke-opacity=".85"/>
      <circle cx="72" cy="130" r="15" fill="#4F46E5"/>
      <path d="M72 122v16M64 130h16" stroke="#E0E7FF" stroke-width="2.4" stroke-linecap="round"/>
      <text x="98" y="136" fill="#FFFFFF" font-size="19" font-weight="700">Zangetsu app</text>
      <text x="60" y="166" fill="#C7D2FE" font-size="13.5">Settings → Providers → Zangetsu providers</text>
      <text x="60" y="186" fill="#C7D2FE" font-size="13.5">Downloads the manifest, installs one script per source,</text>
      <text x="60" y="204" fill="#C7D2FE" font-size="13.5">then calls each provider function in order.</text>

      <rect x="612" y="96" width="552" height="118" rx="16" fill="url(#archRepo)" stroke="#F472B6" stroke-opacity=".85"/>
      <path d="M640 124 h34 v26 h-34 z M640 124 l17 -11 l17 11" fill="none" stroke="#FBCFE8" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="692" y="136" fill="#FFFFFF" font-size="19" font-weight="700">Mewtwo Repo</text>
      <text x="636" y="172" fill="#FCE7F3" font-size="13.5">index.json — manifest listing every source</text>
      <text x="636" y="192" fill="#FCE7F3" font-size="13.5">providers/*.js — one self-contained script per source</text>
      <text x="636" y="210" fill="#FBCFE8" font-size="12.5">The repo hosts code only. It never hosts media.</text>
    </g>

    <path d="M576 155 H606" fill="none" stroke="#C4B5FD" stroke-width="2.4" marker-end="url(#archArrow)"/>
    <text x="591" y="138" text-anchor="middle" fill="#C4B5FD" font-size="10.5" font-weight="600">fetch</text>

    <!-- Layer 2 : provider API -->
    <text x="36" y="248" fill="#A5B4FC" font-size="12.5" font-weight="700" letter-spacing="2.4">PROVIDER API — CALLED IN THIS ORDER</text>

    <g>
      <rect x="36" y="262" width="1128" height="104" rx="16" fill="url(#archApi)" fill-opacity=".92" stroke="#2DD4BF" stroke-opacity=".8"/>

      <g transform="translate(60 284)">
        <rect width="160" height="60" rx="11" fill="#0B1220" fill-opacity=".72" stroke="#5EEAD4" stroke-opacity=".7"/>
        <text x="14" y="26" fill="#CCFBF1" font-size="14" font-weight="700">getInfo()</text>
        <text x="14" y="45" fill="#99F6E4" font-size="12">name · version · logo</text>
      </g>
      <g transform="translate(238 284)">
        <rect width="160" height="60" rx="11" fill="#0B1220" fill-opacity=".72" stroke="#5EEAD4" stroke-opacity=".7"/>
        <text x="14" y="26" fill="#CCFBF1" font-size="14" font-weight="700">getSettings()</text>
        <text x="14" y="45" fill="#99F6E4" font-size="12">settings schema</text>
      </g>
      <g transform="translate(416 284)">
        <rect width="160" height="60" rx="11" fill="#0B1220" fill-opacity=".72" stroke="#5EEAD4" stroke-opacity=".7"/>
        <text x="14" y="26" fill="#CCFBF1" font-size="14" font-weight="700">getHome()</text>
        <text x="14" y="45" fill="#99F6E4" font-size="12">popular() rows</text>
      </g>
      <g transform="translate(594 284)">
        <rect width="160" height="60" rx="11" fill="#0B1220" fill-opacity=".72" stroke="#5EEAD4" stroke-opacity=".7"/>
        <text x="14" y="26" fill="#CCFBF1" font-size="14" font-weight="700">search()</text>
        <text x="14" y="45" fill="#99F6E4" font-size="12">query · page</text>
      </g>
      <g transform="translate(772 284)">
        <rect width="160" height="60" rx="11" fill="#0B1220" fill-opacity=".72" stroke="#5EEAD4" stroke-opacity=".7"/>
        <text x="14" y="26" fill="#CCFBF1" font-size="14" font-weight="700">getDetail()</text>
        <text x="14" y="45" fill="#99F6E4" font-size="12">episodes[] payload</text>
      </g>
      <g transform="translate(950 284)">
        <rect width="192" height="60" rx="11" fill="#0B1220" fill-opacity=".72" stroke="#5EEAD4" stroke-opacity=".7"/>
        <text x="14" y="26" fill="#CCFBF1" font-size="14" font-weight="700">getVideoSources()</text>
        <text x="14" y="45" fill="#99F6E4" font-size="12">streams for one episode</text>
      </g>

      <g stroke="#99F6E4" stroke-opacity=".55" stroke-width="1.6" marker-end="url(#archArrow)">
        <path d="M224 314 H232"/>
        <path d="M402 314 H410"/>
        <path d="M580 314 H588"/>
        <path d="M758 314 H766"/>
        <path d="M936 314 H944"/>
      </g>

      <text x="600" y="356" text-anchor="middle" fill="#99F6E4" font-size="12">Every function returns a Promise. Empty arrays are valid answers — a provider never throws into the app.</text>
    </g>

    <!-- Layer 3 : host runtime + external services -->
    <g>
      <rect x="36" y="392" width="552" height="132" rx="16" fill="url(#archHost)" stroke="#A1A1AA" stroke-opacity=".7"/>
      <text x="60" y="420" fill="#FAFAFA" font-size="17" font-weight="700">Host runtime</text>
      <text x="60" y="440" fill="#E4E4E7" font-size="13">Injected by Zangetsu into every provider scope:</text>
      <text x="60" y="464" fill="#D4D4D8" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">__settings[sourceId][key]</text>
      <text x="60" y="484" fill="#D4D4D8" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">__SOURCE_ID · fetch() · console</text>
      <text x="60" y="504" fill="#D4D4D8" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">sha256Hex · aesCtrDecrypt · htmlText</text>
    </g>

    <g>
      <rect x="612" y="392" width="552" height="132" rx="16" fill="url(#archExt)" stroke="#FBBF24" stroke-opacity=".7"/>
      <text x="636" y="420" fill="#FFF7ED" font-size="17" font-weight="700">External services</text>
      <text x="636" y="440" fill="#FEF3C7" font-size="13">Reached over the network, never bundled:</text>
      <text x="636" y="464" fill="#FDE68A" font-size="12.5">TMDB · AniList · MAL · Kitsu</text>
      <text x="636" y="484" fill="#FDE68A" font-size="12.5">Stremio add-ons · AIOStreams · Jellyfin</text>
      <text x="636" y="504" fill="#FDE68A" font-size="12.5">Anime and movie streaming hosts</text>
    </g>

    <path d="M312 366 V386" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#archArrowDim)"/>
    <path d="M888 366 V386" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#archArrowDim)"/>
  </g>
</svg>
