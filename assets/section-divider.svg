<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="48" viewBox="0 0 1120 48" role="img" aria-labelledby="divTitle divDesc">
  <title id="divTitle">Section divider</title>
  <desc id="divDesc">A slim horizontal ornament: a pink-to-violet gradient rule with a small diamond at its centre.</desc>
  <defs>
    <linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#EC4899" stop-opacity=".65"/>
      <stop offset="0.62" stop-color="#A78BFA" stop-opacity=".65"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9A8D4"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <path d="M0 24 H470" stroke="url(#divGrad)" stroke-width="1.6" stroke-linecap="round"/>
