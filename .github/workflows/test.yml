name: Provider tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate providers and run tests
        run: node scripts/check-and-run.mjs
      - name: Temporary live Senshi source probe
        if: github.event_name == 'pull_request'
        run: node scripts/senshi-live-probe.mjs
