name: Temporary AlmostOTT public endpoint probe

on:
  push:
    branches: ["probe-almostott-api"]

permissions:
  contents: read

jobs:
  inspect-public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out probe branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect public HTML and JavaScript assets
        run: node scripts/probe-almostott.mjs
