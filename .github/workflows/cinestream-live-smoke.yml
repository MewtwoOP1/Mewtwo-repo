name: CineStream live smoke
on:
  pull_request:
    paths:
      - "providers/serenity-cinestream.js"
      - "tests/cinestream.test.js"
      - "tests/cinestream.live-smoke.mjs"
      - ".github/workflows/cinestream-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-cinestream:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live Cinemeta, episode, and Kitsu endpoints
        run: node tests/cinestream.live-smoke.mjs
