name: MovieBox IN live smoke test

on:
  pull_request:
    paths:
      - 'providers/moviebox-in.js'
      - 'tests/moviebox-in.live-smoke.js'
      - '.github/workflows/moviebox-in-live-smoke.yml'
  push:
    branches:
      - fix/moviebox-in-reference-port-20261020
    paths:
      - 'providers/moviebox-in.js'
      - 'tests/moviebox-in.live-smoke.js'
      - '.github/workflows/moviebox-in-live-smoke.yml'

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Exercise live MovieBox API
        run: node tests/moviebox-in.live-smoke.js
