name: Uniquestream live API smoke

on:
  pull_request:
    paths:
      - "providers/uniquestream.js"
      - "tests/uniquestream.live-smoke.mjs"
      - ".github/workflows/uniquestream-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Uniquestream public API
        run: node tests/uniquestream.live-smoke.mjs
