name: MovieBox provider tests

on:
  pull_request:
    paths:
      - "providers/moviebox.js"
      - "tests/moviebox.test.js"
      - "index.json"
      - ".github/workflows/moviebox-test.yml"
  push:
    branches:
      - main
    paths:
      - "providers/moviebox.js"
      - "tests/moviebox.test.js"
      - "index.json"

jobs:
  moviebox-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/moviebox.test.js
